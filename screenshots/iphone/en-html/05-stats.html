<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&display=swap');
html,body{margin:0;padding:0;}
body{background:#0a1f15;}
.canvas{position:relative;width:1284px;height:2778px;overflow:hidden;background:linear-gradient(180deg,#07150e 0%,#0d2a1c 45%,#123524 100%);}
.bg{position:absolute;inset:0;background-image:url('../../backgrounds/iphone-stats.png');background-size:cover;background-position:center;}
.scrim{position:absolute;left:0;top:0;width:100%;height:30%;background:radial-gradient(ellipse 75% 70% at 50% 40%,rgba(5,16,10,0.55) 0%,rgba(5,16,10,0.25) 55%,rgba(5,16,10,0) 100%);}
.headline{font-family:'Playfair Display',serif;font-weight:700;font-size:124px;line-height:1.08;color:#F8F2E4;margin:0;letter-spacing:-0.5px;text-shadow:0 4px 24px rgba(0,0,0,0.55),0 1px 2px rgba(0,0,0,0.6);}
.headline span{color:#E2BE6A;}
</style>
</head>
<body>
<div class="canvas">
  <div class="bg"></div>
  <div class="scrim"></div>
  <div style="position:absolute; top:0%; left:50%; width:84%; height:22%; transform:translateX(-50%); display:flex; align-items:center; justify-content:center; text-align:center;">
    <h1 class="headline">Your Career<br><span>Record</span></h1>
  </div>
  <div style="position:absolute; left:50%; top:22%; width:78%; transform:translateX(-50%);">
    <div style="position:relative; aspect-ratio:879/1832;">
      <div style="position:absolute; overflow:hidden; left:4.32%; top:2.29%; width:91.47%; height:95.41%; border-radius:7.5% / 3.5%;">
        <img src="../../captures/iphone/05-stats.png" style="display:block; width:100%; height:100%; object-fit:cover; object-position:top;" draggable="false" />
      </div>
      <img src="https://r2-pub.rork.com/static/iphone-mockups/iphone-17-pro-silver.png" style="position:relative; z-index:10; display:block; width:100%; height:100%; pointer-events:none;" draggable="false" />
    </div>
  </div>
</div>
</body>
</html>
